version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch and minor updates arrive as one PR per group, so routine bumps do
    # not consume five slots and hide a security update behind them.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Majors come one at a time: NestJS 12 and TypeScript 7 are both breaking,
    # and they need a human reading the changelog.
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
